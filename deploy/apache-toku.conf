# Include in the existing HTTPS VirtualHost for myworkouttracker.xyz.
# The existing workout-tracker DocumentRoot remains unchanged.
Alias /toku /var/www/toku-tracker/public
<Directory /var/www/toku-tracker/public>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    RewriteEngine On
    RewriteBase /toku/
    RewriteRule ^assets/(app\.css|app\.js|favicon\.svg)$ - [END]
    RewriteRule ^ index.php [END]
</Directory>

<Directory /var/www/toku-tracker/data>
    Require all denied
</Directory>

services:
  tracker:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      TOKU_ALLOW_ANONYMOUS: "1"
      TOKU_DB: /var/lib/toku-tracker/toku.db
      TOKU_BASE_PATH: ""
      TOKU_HTTPS: "0"
    volumes:
      - toku-data:/var/lib/toku-tracker
    restart: unless-stopped

volumes:
  toku-data:
